<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030504">
<title>Portfolio</title>
<style>
:root{--bg:#030504;--fg:#c9ffe6;--dim:#5f8a77;--ac:#00ff9c;--line:rgba(0,255,156,.18);--red:#ff2a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030504}}
:root[data-theme="dark"]{--bg:#030504}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.6;overflow-x:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#vg{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(255,0,30,.35))}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 22px}
section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
.hero{min-height:100svh}
.pr{color:var(--ac);font-size:12px;letter-spacing:.12em}
h1{font-size:clamp(30px,9.5vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:12px 0 16px;position:relative;min-height:2.3em}
h1.g{text-shadow:2px 0 var(--ac),-2px 0 #fff;transform:skewX(-4deg)}
.ty{color:var(--dim);min-height:1.6em}
.ty b{color:var(--ac);font-weight:400}
.cur{display:inline-block;width:8px;height:15px;background:var(--ac);vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:22px;color:var(--dim);font-size:11px;letter-spacing:.2em;animation:f 2s ease-in-out infinite}
@keyframes f{50%{transform:translateY(6px);opacity:.5}}
h2{font-size:12px;font-weight:400;color:var(--ac);letter-spacing:.2em;margin-bottom:22px}
ul{list-style:none;padding:0;perspective:700px}
li{display:flex;gap:12px;align-items:center;padding:7px 0;opacity:0;transform:rotateX(-80deg) translateY(24px);transform-origin:top;transition:opacity .6s,transform .6s}
li.v{opacity:1;transform:none}
li i{font-style:normal;color:var(--dim);font-size:11px;min-width:22px}
.d{flex:1;min-height:42px;padding:8px 12px;border:1px solid var(--line);background:rgba(0,255,156,.05);color:var(--ac);text-shadow:0 0 8px rgba(0,255,156,.7);letter-spacing:.08em;text-transform:uppercase;font-size:13px;box-shadow:inset 0 0 14px rgba(0,255,156,.08);white-space:nowrap;overflow:hidden}
.btn{display:inline-flex;gap:10px;margin-top:26px;padding:14px 20px;border:1px solid var(--ac);color:var(--ac);text-decoration:none;letter-spacing:.1em;font-size:13px;background:rgba(0,255,156,.05);backdrop-filter:blur(6px)}
.btn:active{background:var(--ac);color:#000}
p.s{color:var(--dim)}
.end{color:var(--red);text-shadow:0 0 12px rgba(255,42,61,.6)}
.end .big{font-size:clamp(22px,7vw,32px);font-weight:700;line-height:1.25;min-height:3.8em;margin-bottom:18px}
.end .inf{font-size:12px;min-height:11em;opacity:.9}
.end .inf div{white-space:nowrap;overflow:hidden}
.end .cur{background:var(--red)}
.sk{animation:sk .4s}
@keyframes sk{20%{transform:translate(-4px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,3px)}}
.fl{animation:fl .15s 4}
@keyframes fl{50%{opacity:.2}}
#snd{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--ac);font:11px ui-monospace,monospace;letter-spacing:.1em;padding:7px 10px}
footer{padding:30px 0 40px;color:var(--dim);font-size:11px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="vg"></div>
<button id="snd">SND: ON</button>
<main>
<section class="hero"><div id="hc">
  <div class="pr">root@portfolio:~$ whoami</div>
  <h1 id="n"></h1>
  <div class="ty"><b>&gt;</b> <span id="t"></span><span class="cur"></span></div>
</div><div class="hint">▼ SCROLL · TAP FOR SOUND</div></section>
<section>
  <h2>// SKILLS.exe</h2>
  <ul id="l"></ul>
</section>
<section>
  <h2>// CONTACT</h2>
  <p class="s">Project or collaboration? Write to me.</p>
  <div><a class="btn" href="https://t.me/kasdevfx">▸ TELEGRAM</a></div>
</section>
<section class="end" id="end">
  <div class="big" id="b1"></div>
  <div class="inf" id="inf"></div>
</section>
<footer>© <span id="y"></span> · secure_connection: true</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var roles=["Software Engineer","Full Stack Developer","Mobile App Developer","Cybersecurity Specialist","Ethical Hacker","Penetration Tester","Network Security Engineer","Information Security Analyst","Machine Learning Engineer","AI Engineer","Data Scientist","Data Analyst","Deep Learning Engineer","Cloud Engineer","DevOps Engineer","Database Engineer","QA Engineer","Game Developer","Blockchain Developer","Systems Engineer"];
$('y').textContent=new Date().getFullYear();
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
// audio
var AC=null,snd=true;
function init(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
['touchend','pointerdown','click','keydown'].forEach(function(e){addEventListener(e,init,{passive:true})});
$('snd').onclick=function(e){snd=!snd;this.textContent='SND: '+(snd?'ON':'OFF')};
function beep(f,d,v,ty,at){if(!snd||!AC||AC.state!=='running')return;try{var t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.03,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function key(){beep(850+Math.random()*350,.045,.035)}
function done(){beep(1600,.1,.04);beep(2100,.14,.04,'square',.09)}
function thud(){beep(70,.35,.15,'sine')}
function typeInto(el,txt,sp,fn){return new Promise(function(res){var i=0;(function s(){el.textContent=txt.slice(0,++i);if(fn)fn(txt[i-1]);if(i<txt.length)setTimeout(s,sp);else res()})()})}
// hero
(async function(){var h=$('n'),w="Hope you won’t regret it.";await sleep(500);await typeInto(h,w,70,function(c){if(c!==' ')beep(300+Math.random()*80,.05,.02,'sawtooth')});
setInterval(function(){h.classList.add('g');setTimeout(function(){h.classList.remove('g')},140)},3200)})();
var ti=0,ci=0,del=false,te=$('t');
(function tick(){var w=roles[ti];ci+=del?-1:1;te.textContent=w.slice(0,ci);var d=del?35:75;
if(!del&&ci===w.length){del=true;d=1400}else if(del&&ci===0){del=false;ti=(ti+1)%roles.length;d=300}setTimeout(tick,d)})();
// roles with calculator typing
var ul=$('l'),q=Promise.resolve(),pend=0;
roles.forEach(function(r,i){var li=document.createElement('li');li.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i><div class="d"></div>';li._t=r;ul.appendChild(li)});
var io=new IntersectionObserver(function(es){es.forEach(function(x){if(!x.isIntersecting)return;var li=x.target;io.unobserve(li);li.classList.add('v');pend++;
q=q.then(function(){return typeInto(li.lastChild,li._t+' ',pend>3?16:40,key)}).then(function(){pend--;done();li.lastChild.textContent=li._t})})},{threshold:.6});
Array.prototype.forEach.call(ul.children,function(li){io.observe(li)});
// scary ending
var ran=false;
new IntersectionObserver(function(es,o){if(!es[0].isIntersecting||ran)return;ran=true;o.disconnect();(async function(){
var b=$('b1'),inf=$('inf');
if(AC&&snd){beep(55,6,.07,'sawtooth')}
document.body.classList.add('fl');thud();await sleep(500);
await typeInto(b,"I told you you’d regret it.",90,function(){beep(110,.08,.05,'sawtooth')});
await sleep(900);b.classList.add('sk');thud();
b.innerHTML+='<br>';var s2=document.createElement('span');b.appendChild(s2);
await typeInto(s2,"Because now I have all your information.",70,function(){beep(120+Math.random()*30,.06,.05,'sawtooth')});
thud();document.body.classList.add('sk');
var tz='?';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
var ln=['device: '+(navigator.platform||'unknown'),'screen: '+screen.width+'x'+screen.height,'language: '+navigator.language,'timezone: '+tz,'cpu cores: '+(navigator.hardwareConcurrency||'?'),'uploading... 100%','see you soon.'];
await sleep(700);
for(var i=0;i<ln.length;i++){var d=document.createElement('div');inf.appendChild(d);await typeInto(d,'> '+ln[i],28,key);await sleep(250)}
inf.lastChild.innerHTML+='<span class="cur"></span>';
})()},{threshold:.5}).observe($('end'));
// 3D
try{
var cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene();S.fog=new THREE.Fog(0x030504,6,34);
var C=new THREE.PerspectiveCamera(60,1,.1,100);C.position.z=6;
var mats=[],G=new THREE.Group();S.add(G);
function M(o,w){var m=new THREE.MeshBasicMaterial({color:0x00ff9c,wireframe:true,transparent:true,opacity:o});mats.push(m);return m}
var m1=new THREE.Mesh(new THREE.IcosahedronGeometry(2,1),M(.35)),m2=new THREE.Mesh(new THREE.OctahedronGeometry(1.1,0),M(.5));G.add(m1,m2);
var rings=[],i;
for(i=0;i<11;i++){var r=new THREE.Mesh(new THREE.TorusGeometry(2.8+(i%3)*.5,.015,6,90),M(.55));r.position.z=-6-i*4.5;r.rotation.z=i;S.add(r);rings.push(r)}
var boxes=[];
for(i=0;i<16;i++){var bx=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.7),M(.45));var sd=i%2?1:-1;bx.position.set(sd*(2.2+Math.random()*3),(Math.random()-.5)*6,-6-i*3);S.add(bx);boxes.push(bx)}
var knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.2,.3,90,10),M(.4));knot.position.set(0,0,-26);S.add(knot);
var dod=new THREE.Mesh(new THREE.DodecahedronGeometry(1.8,0),M(.5));dod.position.set(0,0,-48);S.add(dod);
var N=900,pos=new Float32Array(N*3);
for(i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*16;pos[i*3+1]=(Math.random()-.5)*12;pos[i*3+2]=6-Math.random()*60}
var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
var pm=new THREE.PointsMaterial({color:0x00ff9c,size:.04,transparent:true,opacity:.8});mats.push(pm);S.add(new THREE.Points(pg,pm));
function rs(){var w=innerWidth,hh=innerHeight;R.setSize(w,hh,false);C.aspect=w/hh;C.updateProjectionMatrix();G.position.y=w<700?1.3:0;G.scale.setScalar(w<700?.8:1)}
rs();addEventListener('resize',rs);
var tx=0,ty=0,sp=0,gc=new THREE.Color(0x00ff9c),rc=new THREE.Color(0xff2a3d),hc=$('hc'),vg=$('vg');
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*1.2;ty=(e.clientY/innerHeight-.5)*1.2});
addEventListener('deviceorientation',function(e){if(e.gamma!=null){tx=Math.max(-1,Math.min(1,e.gamma/30))*.6;ty=Math.max(-1,Math.min(1,(e.beta-45)/30))*.6}});
(function loop(t){requestAnimationFrame(loop);t*=.001;
var mx=document.documentElement.scrollHeight-innerHeight,p=mx>0?scrollY/mx:0,v=p-sp;sp+=v*.08;
C.position.z=6-sp*54;C.position.x+=(tx*1.2-C.position.x)*.05;C.position.y+=(-ty*.8-C.position.y)*.05;C.rotation.z=v*6+Math.sin(sp*12)*.08;
m1.rotation.x=t*.2;m1.rotation.y=t*.3;m2.rotation.x=-t*.4;m2.rotation.y=-t*.5;
rings.forEach(function(r,k){r.rotation.z+=.003*(k%2?1:-1)+v*.2});
boxes.forEach(function(b,k){b.rotation.x=t*.3+k;b.rotation.y=t*.4+k});
knot.rotation.x=t*.3;knot.rotation.y=t*.5;dod.rotation.x=t*.2;dod.rotation.y=t*.4;
var k=Math.min(1,Math.max(0,(sp-.8)/.14));k=k*k*(3-2*k);
mats.forEach(function(m){m.color.copy(gc).lerp(rc,k)});vg.style.opacity=k;
hc.style.opacity=Math.max(0,1-sp*9);hc.style.transform='translateZ(0) translateY('+(-sp*300)+'px) scale('+(1+sp*3)+')';
R.render(S,C)})(0);
}catch(e){}
</script>
</body>
</html>
